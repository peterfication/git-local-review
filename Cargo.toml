[package]
name = "git-local-review"
version = "0.2.0"
authors = ["Peter Morgenstern <mail@petergundel.de>"]
edition = "2024"
homepage = "https://github.com/peterfication/git-local-review"
license = "MIT"
readme = "README.md"
repository = "https://github.com/peterfication/git-local-review"
rust-version = "1.94"
description = "A Terminal User Interface (TUI) for reviewing Git changes with local SQLite state storage."

exclude = [
  ".github",
  "AGENT.md",
  "lefthook.yml",
  "dprint.json",
  "assets/screenshot.png",
  "src/**/*.snap",
]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
git2 = "0.20.2"
log = "0.4.34"
ratatui = "0.30.2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tui-logger = "0.18.3"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
# cargo-tarpaulin = "0.32.8"
insta = "1.48.0"
tempfile = "3.27.0"
